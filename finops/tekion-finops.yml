meters:
- name: partner_agreement
  description: Negotiated APC partner-tier fee (Standard / Enterprise / Strategic). Not publicly rated.
  unit: contract
  aggregation: sum
  dimensions:
  - partner
  - tier
- name: api_requests
  description: APC API calls consumed by the partner. Governed by tier rate limits; not publicly priced per call.
  unit: requests
  aggregation: sum
  dimensions:
  - partner
  - api
- name: webhook_events
  description: Webhook events delivered to the partner endpoint. Not publicly rated.
  unit: events
  aggregation: sum
  dimensions:
  - partner
principles:
- name: Visibility
  description: Track which APC APIs and webhook event types each integration consumes, and map them to the partner tier's allowances.
- name: Allocation
  description: Attribute the APC partner-agreement fee and consuming infrastructure to the product line or dealer segment the integration serves.
- name: Optimization
  description: Right-size the partner tier to the APIs actually needed; prefer webhooks over polling to reduce request volume against tier limits.
- name: Accountability
  description: Assign an owner for the Tekion partner relationship; review tier fit and API usage against agreement terms periodically.
