description: >-
  FinOps view of Tekion Automotive Partner Cloud (APC) spend. Tekion does not
  publish public, usage-metered API pricing; APC access is governed by a
  negotiated partner agreement whose tier (Standard, Enterprise/Elevated,
  Strategic/Premium) determines the APIs, rate limits, and capabilities
  available. Cost is therefore contract-driven rather than pay-as-you-go, and is
  not directly meterable from public information. For a partner building on APC,
  the dominant cost drivers are the partner-agreement fee plus the partner's own
  infrastructure to consume APIs and receive webhooks; for a dealer, data access
  is authorized (not sold per call) through the APC Integration Hub.
notes: >-
  No public per-call or per-GB rates exist to reconcile. Treat APC as a
  contract/enterprise cost line. Confirm commercial terms with Tekion partner
  enablement (APCintegrations@tekion.com).
