aid: tekion
name: Tekion
review:
  question: Does Tekion expose a documented public WebSocket API?
  answer: false
  date: '2026-07-10'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Tekion's partner integration surface (the
    Automotive Partner Cloud) is delivered as request/response REST APIs plus
    server-to-endpoint webhooks and FTP feeds. Tekion advertises "APIs and
    webhooks" for near real-time sync - the real-time behavior is push-over-HTTP
    (webhooks POST event payloads to a partner-registered URL), not a
    bidirectional WebSocket. There is no documented ws:// or wss:// transport on
    Tekion's own API to model, and the full technical reference is behind partner
    authentication, so no AsyncAPI was created.
findings:
  summary: |
    Tekion does not publish a documented public WebSocket API. Tekion is a
    cloud-native automotive retail platform (Automotive Retail Cloud / ARC, a
    modern DMS) that exposes dealership data to technology partners through the
    Automotive Partner Cloud (APC). APC is a real, modern, OpenAPI-standard
    partner API program covering sales, service, inventory, and parts data, but
    it is PARTNER-GATED: developers register at apc.tekioncloud.com, submit a use
    case and select APIs, and are reviewed (typically within ~48 hours) before
    the API documentation dashboard, credentials, and endpoints are unlocked.
    Near real-time updates are delivered via REST APIs and webhooks (plus FTP
    feeds), not via a WebSocket. No realtime, bidirectional, or streaming
    WebSocket (ws:// or wss://) endpoint is documented on Tekion's public
    surface as of the review date.
  accessModel: |
    Partner-gated. The APC portal (apc.tekioncloud.com) presents marketing plus a
    register/login gate; the technical API reference is only accessible after
    approval. Access is tiered - Standard (foundational open APIs, standard rate
    limits), Enterprise/Elevated (additional APIs, higher rate limits, expanded
    read/write and reference-data access), and Premium/Strategic (customized
    development, API mapping, specialized workflows, go-to-market support).
    Dealers control which partners can access their data via the APC Integration
    Hub, and can track who accesses what. Because the reference is gated, the
    APIs in apis.yml are honestly MODELED by data domain (EndpointsModeled=true)
    rather than transcribed from a public specification; no OpenAPI or Postman
    collection was fabricated.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.tekioncloud.com
      documented: partner-gated
      note: APC standard/elevated/premium open APIs. Exact base host and paths are documented behind partner login; base shown here is representative.
    - protocol: Webhook
      scheme: https
      documented: partner-gated
      note: Server-to-endpoint webhooks POST change events to a partner-registered HTTP URL for near real-time sync. Not a WebSocket.
    - protocol: FTP
      scheme: ftp
      documented: partner-gated
      note: Tekion's systems-integration program also supports FTP/file feeds for bulk data integration.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere on Tekion's public APC pages as of the review date.
  endpointsModeled: true
  endpointsConfirmedRest: []
sources:
