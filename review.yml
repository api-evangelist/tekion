actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Tekion's public API, and the partner
    API (APC) is request/response REST plus HTTP webhooks and FTP feeds. Because
    the full technical reference is partner-gated, the APIs were modeled by data
    domain (EndpointsModeled=true) and no AsyncAPI, OpenAPI, or collection was
    fabricated.
