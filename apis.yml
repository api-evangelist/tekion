name: Tekion
kind: company
description: >-
  Tekion is a cloud-native, AI-native automotive retail platform whose flagship
  Automotive Retail Cloud (ARC) is a modern dealer management system (DMS)
  spanning sales, service, parts, inventory, F&I, accounting, and CRM for
  franchise dealerships and OEMs. Tekion exposes its data and workflows to
  technology partners through the Automotive Partner Cloud (APC) - an open,
  OpenAPI-standard partner API program with REST APIs and webhooks that give
  approved partners near real-time access to a dealership's sales, service,
  inventory, and parts data. APC is partner-gated: developers register at the
  APC portal, submit a use case, and are reviewed (typically within ~48 hours)
  before the API documentation dashboard, credentials, and endpoints are
  unlocked. Access is tiered (Standard, Enterprise/Elevated, Premium/Strategic)
  with different API scopes, rate limits, and read/write capabilities. Because
  the technical reference is behind partner authentication, the APIs below are
  honestly modeled by data domain rather than transcribed from a public spec.
